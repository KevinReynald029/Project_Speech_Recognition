[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nihals-pronunciation-scoring"
version = "0.3.0"
description = "Reference-based phoneme pronunciation assessment for the team SpeechOcean762 project"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2", "soundfile>=0.12,<1", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
notebook = ["ipykernel>=6", "nbformat>=5", "nbclient>=0.10"]
runtime = ["zstandard>=0.23; python_version < '3.14'"]
test = ["jsonschema>=4.18,<5"]

[project.scripts]
phoneme-score = "phoneme_scoring.cli:main"

[tool.setuptools.packages.find]
include = ["phoneme_scoring*"]

[tool.setuptools.package-data]
phoneme_scoring = ["*.sh"]
